<?xml version="1.0" encoding="UTF-8"?>
<!-- Official-ish seal of the Office of Ordinary Hauntings. Not actually official. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Seal of the Office of Ordinary Hauntings">
  <defs>
    <path id="top-arc" d="M 30,100 A 70,70 0 0 1 170,100"/>
    <path id="bottom-arc" d="M 22,100 A 78,78 0 0 0 178,100"/>
  </defs>
  <circle cx="100" cy="100" r="96" fill="#f4ecd0" stroke="#1a1a4a" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1a1a4a" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#1a1a4a" stroke-width="1.5"/>
  <text font-family="Times New Roman, serif" font-size="14" font-weight="bold" fill="#1a1a4a" letter-spacing="2">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">OFFICE OF ORDINARY</textPath>
  </text>
  <text font-family="Times New Roman, serif" font-size="14" font-weight="bold" fill="#1a1a4a" letter-spacing="3">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">HAUNTINGS &#8226; EST. 1964</textPath>
  </text>
  <!-- the ghost -->
  <path d="M100 58 C80 58 72 74 72 92 L72 128 L80 120 L88 128 L96 120 L104 128 L112 120 L120 128 L128 120 L128 92 C128 74 120 58 100 58 Z"
        fill="#ffffff" stroke="#1a1a4a" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="90" cy="88" rx="4.5" ry="7" fill="#1a1a4a"/>
  <ellipse cx="110" cy="88" rx="4.5" ry="7" fill="#1a1a4a"/>
  <ellipse cx="100" cy="106" rx="5" ry="6.5" fill="#1a1a4a"/>
</svg>
